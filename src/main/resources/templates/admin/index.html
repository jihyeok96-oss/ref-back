<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <!-- ====================================== -->
    <!-- 관리자 대시보드 제목 -->
    <!-- ====================================== -->
    <div class="mb-4">
        <h2 class="fw-bold">
            관리자 대시보드
        </h2>
        <p class="text-muted">
            시스템 관리 기능을 제공합니다.
        </p>
    </div>
    <!-- ====================================== -->
    <!-- 관리자 메뉴 -->
    <!-- ====================================== -->
    <div class="row g-3 mb-5">
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        회원 관리
                    </h5>
                    <p class="card-text text-muted">
                        회원 목록 및 회원 상태를 관리합니다.
                    </p>
                    <a href="/admin/members"
                       class="btn btn-primary">
                        회원 관리
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        시스템 관리
                    </h5>
                    <p class="card-text text-muted">
                        시스템 설정을 관리합니다.
                    </p>
                    <button type="button"
                            class="btn btn-secondary"
                            disabled>
                        준비 중
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        로그 관리
                    </h5>
                    <p class="card-text text-muted">
                        시스템 로그를 확인합니다.
                    </p>
                    <button type="button"
                            class="btn btn-secondary"
                            disabled>
                        준비 중
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- ====================================== -->
    <!-- 최근 가입 회원 -->
    <!-- ====================================== -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <div class="d-flex
                        justify-content-between
                        align-items-center">
                <h5 class="mb-0">
                    최근 가입 회원
                </h5>
                <a href="/admin/members"
                   class="btn btn-sm btn-light">
                    전체 회원 보기
                </a>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table
                              table-hover
                              align-middle
                              mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="text-center">
                            번호
                        </th>
                        <th>
                            아이디
                        </th>
                        <th>
                            이름
                        </th>
                        <th>
                            이메일
                        </th>
                        <th>
                            권한
                        </th>
                        <th>
                            상태
                        </th>
                        <th>
                            가입일
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 최근 회원 반복 -->
                    <tr th:each="member : ${recentMembers}">
                        <td class="text-center"
                            th:text="${member.id}">
                            1
                        </td>
                        <td>
                            <a th:href="@{/admin/members/{id}
                                         (id=${member.id})}"
                               class="text-decoration-none"
                               th:text="${member.loginId}">
                                user01
                            </a>
                        </td>
                        <td th:text="${member.name}">
                            홍길동
                        </td>
                        <td th:text="${member.email}">
                            user@example.com
                        </td>
                        <td>
                            <span
                                    th:if="${member.role.name() == 'ADMIN'}"
                                    class="badge bg-danger">
                                ADMIN
                            </span>
                            <span
                                    th:if="${member.role.name() == 'USER'}"
                                    class="badge bg-primary">
                                USER
                            </span>
                        </td>
                        <td>
                            <span
                                    th:if="${member.status.name() == 'ACTIVE'}"
                                    class="badge bg-success">
                                ACTIVE
                            </span>
                            <span
                                    th:if="${member.status.name() == 'INACTIVE'}"
                                    class="badge bg-secondary">
                                INACTIVE
                            </span>
                            <span
                                    th:if="${member.status.name() == 'KICKED'}"
                                    class="badge bg-danger">
                                KICKED
                            </span>
                        </td>
                        <td
                                th:text="${#temporals.format(
                                member.createdAt,
                                'yyyy-MM-dd HH:mm'
                            )}">
                            2026-09-23 15:00
                        </td>
                    </tr>
                    <!-- 회원이 없는 경우 -->
                    <tr th:if="${#lists.isEmpty(recentMembers)}">
                        <td colspan="7"
                            class="text-center py-5 text-muted">
                            최근 가입한 회원이 없습니다.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
