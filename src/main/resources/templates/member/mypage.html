<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>마이페이지</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="mb-4">
                마이페이지
            </h2>
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table">
                        <tr>
                            <th width="180">회원번호</th>
                            <td th:text="${member.id}"></td>
                        </tr>
                        <tr>
                            <th>아이디</th>
                            <td th:text="${member.loginId}"></td>
                        </tr>
                        <tr>
                            <th>이름</th>
                            <td th:text="${member.name}"></td>
                        </tr>
                        <tr>
                            <th>이메일</th>
                            <td th:text="${member.email}"></td>
                        </tr>
                        <tr>
                            <th>권한</th>
                            <td>
                                <span class="badge bg-primary"
                                      th:if="${member.role.name() == 'USER'}">
                                    USER
                                </span>
                                <span class="badge bg-danger"
                                      th:if="${member.role.name() == 'ADMIN'}">
                                    ADMIN
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <th>상태</th>
                            <td th:text="${member.status}"></td>
                        </tr>
                        <tr>
                            <th>약관 동의</th>
                            <td>
                                <span class="text-success"
                                      th:if="${member.termsAgreed}">
                                    동의
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <th>개인정보 동의</th>
                            <td>
                                <span class="text-success"
                                      th:if="${member.privacyAgreed}">
                                    동의
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <th>가입일</th>
                            <td th:text="${member.createdAt}"></td>
                        </tr>
                    </table>
                    <div class="d-flex gap-2">
                        <a href="/member/edit"
                           class="btn btn-primary">
                            회원정보 수정
                        </a>
                        <a href="/member/delete"
                           class="btn btn-outline-danger">
                            회원 탈퇴
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
