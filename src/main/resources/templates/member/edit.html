<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>회원정보 수정</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="mb-4">
                        회원정보 수정
                    </h2>
                    <div class="alert alert-danger"
                         th:if="${error}"
                         th:text="${error}">
                    </div>
                    <form action="/member/edit"
                          method="post">
                        <div class="mb-3">
                            <label class="form-label">
                                아이디
                            </label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${member.loginId}"
                                   readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                이름
                            </label>
                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   th:value="${member.name}"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                이메일
                            </label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   th:value="${member.email}"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                새 비밀번호
                            </label>
                            <input type="password"
                                   name="password"
                                   class="form-control">
                            <div class="form-text">
                                변경하지 않으려면 비워두세요.
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/member/mypage"
                               class="btn btn-secondary">
                                취소
                            </a>
                            <button type="submit"
                                    class="btn btn-primary">
                                수정하기
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
