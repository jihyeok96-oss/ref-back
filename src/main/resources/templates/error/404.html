<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - 페이지를 찾을 수 없습니다</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #0f172a;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Malgun Gothic",
                "맑은 고딕",
                sans-serif;
        }

        .error-container {
            width: 100%;
            max-width: 680px;
            padding: 40px 24px;
            text-align: center;
        }

        .error-code {
            margin: 0;
            font-size: 120px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -6px;
            color: #3b82f6;
        }

        .error-title {
            margin: 28px 0 12px;
            font-size: 30px;
            font-weight: 700;
        }

        .error-message {
            margin: 0 auto;
            max-width: 500px;
            color: #64748b;
            font-size: 16px;
            line-height: 1.7;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 130px;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .button-primary {
            background: #0f172a;
            color: white;
        }

        .button-primary:hover {
            background: #1e293b;
        }

        .button-secondary {
            background: white;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .button-secondary:hover {
            background: #f1f5f9;
        }

        .error-info {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="error-container">

    <p class="error-code">404</p>

    <h1 class="error-title">
        페이지를 찾을 수 없습니다.
    </h1>

    <p class="error-message">
        요청하신 페이지가 존재하지 않거나<br>
        주소가 변경되었거나 삭제되었을 수 있습니다.
    </p>

    <div class="button-group">

        <a href="/" class="button button-primary">
            홈으로 이동
        </a>

        <a href="/qna" class="button button-secondary">
            Q&A로 이동
        </a>

        <a href="javascript:history.back()"
           class="button button-secondary">
            이전 페이지
        </a>

    </div>

    <div class="error-info">
        HTTP 404 Not Found
    </div>

</div>

</body>
</html>
