<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${qna != null ? 'Q&A 수정' : 'Q&A 작성'}">
        Q&A 작성
    </title>

    <!-- Bootstrap 5.3.3 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 프로젝트 공통 CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<!-- ================================
     Q&A 작성 / 수정
================================ -->
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <!-- ================================
                 페이지 제목
            ================================= -->
            <div class="text-center mb-4">

                <h1 class="fw-bold">

                    <i th:if="${qna == null}"
                       class="bi bi-pencil-square">
                    </i>

                    <i th:if="${qna != null}"
                       class="bi bi-pencil">
                    </i>

                    <span th:text="${qna != null ? 'Q&A 수정' : 'Q&A 작성'}">
                        Q&A 작성
                    </span>

                </h1>

                <p class="text-muted">

                    <span th:if="${qna == null}">
                        궁금한 내용을 작성해 주세요.
                    </span>

                    <span th:if="${qna != null}">
                        질문 내용을 수정할 수 있습니다.
                    </span>

                </p>

            </div>


            <!-- ================================
                 Form Card
            ================================= -->
            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">


                    <!-- ================================
                         신규 작성
                    ================================= -->
                    <form
                            th:if="${qna == null}"
                            method="post"
                            action="/qna">


                        <!-- 제목 -->
                        <div class="mb-4">

                            <label
                                    for="title"
                                    class="form-label fw-semibold">

                                제목

                            </label>

                            <input
                                    type="text"
                                    id="title"
                                    name="title"
                                    class="form-control form-control-lg"
                                    placeholder="질문 제목을 입력하세요."
                                    maxlength="200"
                                    required>

                            <div class="form-text">
                                질문 내용을 잘 나타낼 수 있는 제목을 입력해 주세요.
                            </div>

                        </div>


                        <!-- 내용 -->
                        <div class="mb-4">

                            <label
                                    for="content"
                                    class="form-label fw-semibold">

                                질문 내용

                            </label>

                            <textarea
                                    id="content"
                                    name="content"
                                    class="form-control"
                                    rows="12"
                                    placeholder="질문 내용을 입력하세요."
                                    required></textarea>

                        </div>


                        <!-- 버튼 -->
                        <div class="d-flex justify-content-end gap-2">

                            <a
                                    href="/qna"
                                    class="btn btn-outline-secondary">

                                <i class="bi bi-x-lg"></i>
                                취소

                            </a>

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-lg"></i>
                                질문 등록

                            </button>

                        </div>

                    </form>


                    <!-- ================================
                         수정
                    ================================= -->
                    <form
                            th:if="${qna != null}"
                            th:action="@{/qna/{id}/edit(id=${qna.id})}"
                            method="post">


                        <!-- 제목 -->
                        <div class="mb-4">

                            <label
                                    for="title"
                                    class="form-label fw-semibold">

                                제목

                            </label>

                            <input
                                    type="text"
                                    id="title"
                                    name="title"
                                    class="form-control form-control-lg"
                                    th:value="${qna.title}"
                                    maxlength="200"
                                    required>

                        </div>


                        <!-- 내용 -->
                        <div class="mb-4">

                            <label
                                    for="content"
                                    class="form-label fw-semibold">

                                질문 내용

                            </label>

                            <textarea
                                    id="content"
                                    name="content"
                                    class="form-control"
                                    rows="12"
                                    required
                                    th:text="${qna.content}">
                            </textarea>

                        </div>


                        <!-- 버튼 -->
                        <div class="d-flex justify-content-end gap-2">

                            <a
                                    th:href="@{/qna/{id}(id=${qna.id})}"
                                    class="btn btn-outline-secondary">

                                <i class="bi bi-x-lg"></i>
                                취소

                            </a>

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                <i class="bi bi-check-lg"></i>
                                수정 완료

                            </button>

                        </div>

                    </form>

                </div>

            </div>


            <!-- 안내 -->
            <div class="alert alert-info mt-4">

                <i class="bi bi-info-circle"></i>

                질문을 등록하면 관리자에게 전달되며,
                관리자가 답변을 등록하면 답변 상태로 변경됩니다.

            </div>


        </div>

    </div>

</main>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
