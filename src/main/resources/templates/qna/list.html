<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Q&A</title>

    <!-- Bootstrap 5.3.3 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 프로젝트 공통 CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<!-- ================================
     Q&A 메인
================================ -->
<main class="container py-5">

    <!-- 페이지 제목 -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="fw-bold mb-2">
                <i class="bi bi-question-circle"></i>
                Q&A
            </h1>

            <p class="text-muted mb-0">
                궁금한 내용을 질문하고 답변을 확인할 수 있습니다.
            </p>
        </div>

        <!-- 질문 작성 -->
        <a href="/qna/new"
           class="btn btn-primary">

            <i class="bi bi-pencil-square"></i>
            질문 작성
        </a>

    </div>


    <!-- ================================
         Q&A 카드
    ================================= -->
    <div class="card shadow-sm border-0">

        <!-- 카드 헤더 -->
        <div class="card-header bg-white py-3">

            <div class="d-flex justify-content-between align-items-center">

                <span class="fw-semibold">
                    Q&A 목록
                </span>

                <span class="badge text-bg-secondary"
                      th:text="${#lists.size(qnas) + '개'}">
                    0개
                </span>

            </div>

        </div>


        <!-- ================================
             Q&A 테이블
        ================================= -->
        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">

                    <tr>
                        <th class="text-center"
                            style="width: 80px;">
                            ID
                        </th>

                        <th>
                            제목
                        </th>

                        <th class="text-center"
                            style="width: 150px;">
                            작성자
                        </th>

                        <th class="text-center"
                            style="width: 120px;">
                            상태
                        </th>

                        <th class="text-center"
                            style="width: 180px;">
                            작성일
                        </th>
                    </tr>

                    </thead>


                    <tbody>

                    <!-- Q&A 목록 -->
                    <tr th:each="qna : ${qnas}">

                        <!-- ID -->
                        <td class="text-center text-muted"
                            th:text="${qna.id}">
                            1
                        </td>


                        <!-- 제목 -->
                        <td>

                            <a th:href="@{/qna/{id}(id=${qna.id})}"
                               th:text="${qna.title}"
                               class="text-decoration-none fw-semibold text-dark">

                                질문 제목
                            </a>

                        </td>


                        <!-- 작성자 -->
                        <td class="text-center"
                            th:text="${qna.member.name}">
                            홍길동
                        </td>


                        <!-- 상태 -->
                        <td class="text-center">

                            <!-- 답변 완료 -->
                            <span th:if="${qna.status.name() == 'ANSWERED'}"
                                  class="badge text-bg-success">

                                <i class="bi bi-check-circle"></i>
                                답변 완료

                            </span>


                            <!-- 답변 대기 -->
                            <span th:unless="${qna.status.name() == 'ANSWERED'}"
                                  class="badge text-bg-warning">

                                <i class="bi bi-hourglass-split"></i>
                                답변 대기

                            </span>

                        </td>


                        <!-- 작성일 -->
                        <td class="text-center text-muted"
                            th:text="${#temporals.format(qna.createdAt, 'yyyy-MM-dd HH:mm')}">

                            2026-01-01 12:00

                        </td>

                    </tr>


                    <!-- ================================
                         데이터 없음
                    ================================= -->
                    <tr th:if="${#lists.isEmpty(qnas)}">

                        <td colspan="5"
                            class="text-center py-5">

                            <div class="text-muted">

                                <i class="bi bi-inbox fs-1 d-block mb-3"></i>

                                <h5 class="mb-2">
                                    등록된 Q&A가 없습니다.
                                </h5>

                                <p class="mb-3">
                                    첫 번째 질문을 등록해 보세요.
                                </p>

                                <a href="/qna/new"
                                   class="btn btn-primary">

                                    <i class="bi bi-pencil-square"></i>
                                    질문 작성

                                </a>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- 뒤로가기 -->
    <div class="mt-4">

        <a href="/"
           class="btn btn-outline-secondary">

            <i class="bi bi-house"></i>
            메인으로

        </a>

    </div>

</main>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
