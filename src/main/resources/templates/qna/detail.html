<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Q&A 상세</title>

    <!-- Bootstrap 5.3.3 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 프로젝트 공통 CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>


<!-- ================================
     Q&A 상세
================================ -->
<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">


            <!-- ================================
                 질문 카드
            ================================= -->
            <div class="card shadow-sm border-0 mb-4">

                <!-- 카드 헤더 -->
                <div class="card-header bg-white p-4">

                    <!-- 제목 -->
                    <h1
                            class="fw-bold mb-3"
                            th:text="${qna.title}">

                        질문 제목

                    </h1>


                    <!-- 질문 정보 -->
                    <div class="d-flex flex-wrap gap-3 text-muted">

                        <span>

                            <i class="bi bi-person"></i>

                            작성자:

                            <strong
                                    class="text-dark"
                                    th:text="${qna.member.name}">

                                홍길동

                            </strong>

                        </span>


                        <span>
                            |
                        </span>


                        <span>

                            <i class="bi bi-calendar3"></i>

                            작성일:

                            <span
                                    th:text="${#temporals.format(qna.createdAt, 'yyyy-MM-dd HH:mm')}">

                                2026-01-01 12:00

                            </span>

                        </span>

                    </div>

                </div>


                <!-- 질문 내용 -->
                <div class="card-body p-4 p-md-5">

                    <div class="mb-3">

                        <span class="badge text-bg-primary">

                            <i class="bi bi-question-circle"></i>
                            질문

                        </span>

                    </div>


                    <div
                            class="fs-5"
                            style="white-space: pre-wrap; line-height: 1.8;"
                            th:text="${qna.content}">

                        질문 내용

                    </div>

                </div>

            </div>


            <!-- ================================
                 답변 카드
            ================================= -->
            <div class="card shadow-sm border-0 mb-4">

                <div class="card-header bg-white p-4">

                    <h3 class="fw-bold mb-0">

                        <i class="bi bi-chat-left-text"></i>
                        답변

                    </h3>

                </div>


                <div class="card-body p-4 p-md-5">


                    <!-- 답변이 있는 경우 -->
                    <div th:if="${qna.answer != null}">

                        <div class="alert alert-success">

                            <div class="d-flex align-items-center">

                                <i class="bi bi-check-circle-fill fs-4 me-2"></i>

                                <strong>
                                    답변이 등록되었습니다.
                                </strong>

                            </div>

                        </div>


                        <div
                                class="fs-5"
                                style="white-space: pre-wrap; line-height: 1.8;"
                                th:text="${qna.answer}">

                            답변 내용

                        </div>


                        <!-- 답변 작성일 -->
                        <div
                                class="text-end text-muted mt-4"
                                th:if="${qna.answeredAt != null}">

                            <i class="bi bi-clock"></i>

                            답변일:

                            <span
                                    th:text="${#temporals.format(qna.answeredAt, 'yyyy-MM-dd HH:mm')}">

                                2026-01-01 13:00

                            </span>

                        </div>

                    </div>


                    <!-- 답변이 없는 경우 -->
                    <div
                            th:unless="${qna.answer != null}"
                            class="text-center py-4">

                        <i
                                class="bi bi-hourglass-split text-warning"
                                style="font-size: 3rem;">
                        </i>

                        <h5 class="mt-3">
                            아직 답변이 등록되지 않았습니다.
                        </h5>

                        <p class="text-muted mb-0">
                            관리자가 확인 후 답변을 등록할 예정입니다.
                        </p>

                    </div>

                </div>

            </div>


            <!-- ================================
                 관리자 답변 관리
            ================================= -->
            <section
                    th:if="${isAdmin}"
                    class="card shadow-sm border-0 mb-4">

                <div class="card-header bg-dark text-white p-3">

                    <h5 class="mb-0">

                        <i class="bi bi-shield-lock"></i>
                        관리자 답변 관리

                    </h5>

                </div>


                <div class="card-body p-4">


                    <!-- 답변 등록 / 수정 -->
                    <h5
                            class="fw-bold mb-3"
                            th:text="${qna.answer == null ? '답변 등록' : '답변 수정'}">

                        답변 등록

                    </h5>


                    <form
                            th:action="@{/qna/{id}/answer(id=${qna.id})}"
                            method="post">


                        <div class="mb-3">

                            <textarea
                                    name="answer"
                                    class="form-control"
                                    rows="8"
                                    placeholder="답변 내용을 입력하세요."
                                    required
                                    th:text="${qna.answer}">
                            </textarea>

                        </div>


                        <div class="d-flex justify-content-end gap-2">

                            <button
                                    type="submit"
                                    class="btn btn-dark">

                                <i class="bi bi-send"></i>

                                <span
                                        th:text="${qna.answer == null ? '답변 등록' : '답변 수정'}">

                                    답변 등록

                                </span>

                            </button>

                        </div>

                    </form>


                    <!-- 답변 삭제 -->
                    <div
                            th:if="${qna.answer != null}"
                            class="border-top mt-4 pt-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <strong>
                                    답변 삭제
                                </strong>

                                <p class="text-muted mb-0 small">
                                    현재 등록된 답변을 삭제하고 답변 대기 상태로 변경합니다.
                                </p>

                            </div>


                            <form
                                    th:action="@{/qna/{id}/answer/delete(id=${qna.id})}"
                                    method="post">

                                <button
                                        type="submit"
                                        class="btn btn-outline-danger">

                                    <i class="bi bi-trash"></i>
                                    답변 삭제

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </section>


            <!-- ================================
                 질문 관리 버튼
            ================================= -->
            <div class="card shadow-sm border-0">

                <div class="card-body">

                    <div
                            class="d-flex flex-wrap justify-content-between gap-2">


                        <!-- 목록 -->
                        <a
                                href="/qna"
                                class="btn btn-outline-secondary">

                            <i class="bi bi-list"></i>
                            목록

                        </a>


                        <div class="d-flex gap-2">


                            <!-- 수정 -->
                            <a
                                    th:href="@{/qna/{id}/edit(id=${qna.id})}"
                                    class="btn btn-outline-primary">

                                <i class="bi bi-pencil"></i>
                                수정

                            </a>


                            <!-- 삭제 -->
                            <form
                                    th:action="@{/qna/{id}/delete(id=${qna.id})}"
                                    method="post"
                                    class="d-inline">

                                <button
                                        type="submit"
                                        class="btn btn-outline-danger">

                                    <i class="bi bi-trash"></i>
                                    삭제

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
