<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>자료실</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h2>자료실</h2>
            <p class="text-secondary">관리자가 등록한 자료를 다운로드할 수 있습니다.</p></div>
        <a th:if="${isAdmin}" href="/files/new" class="btn btn-primary">자료 업로드</a></div>
    <div class="card shadow-sm">
        <div th:if="${#lists.isEmpty(files)}" class="p-5 text-center text-secondary">등록된 자료가 없습니다.</div>
        <div th:unless="${#lists.isEmpty(files)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>제목</th>
                    <th>파일</th>
                    <th>크기</th>
                    <th>다운로드</th>
                    <th>등록일</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f:${files}">
                    <td th:text="${f.title}"></td>
                    <td th:text="${f.originalFileName}"></td>
                    <td th:text="${#numbers.formatDecimal(f.fileSize / 1024.0 / 1024.0,1,2)} + ' MB'"></td>
                    <td th:text="${f.downloadCount}"></td>
                    <td th:text="${#temporals.format(f.createdAt,'yyyy-MM-dd HH:mm')}"></td>
                    <td><a class="btn btn-sm btn-outline-primary" th:href="@{/files/{id}/download(id=${f.id})}">다운로드</a>
                        <form th:if="${isAdmin}" th:action="@{/files/{id}/delete(id=${f.id})}" method="post"
                              class="d-inline" onsubmit="return confirm('삭제하시겠습니까?')">
                            <button class="btn btn-sm btn-outline-danger">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
