<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>자료 업로드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4"><h2 class="mb-4">자료 업로드</h2>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <form method="post" action="/files" enctype="multipart/form-data"><label class="form-label">자료
                        제목</label><input name="title" maxlength="200" class="form-control mb-3" required><label
                            class="form-label">파일</label><input type="file" name="file" class="form-control mb-2"
                                                                required>
                        <div class="form-text mb-4">최대 50MB</div>
                        <div class="text-end"><a href="/files" class="btn btn-secondary me-2">취소</a>
                            <button class="btn btn-primary">업로드</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
