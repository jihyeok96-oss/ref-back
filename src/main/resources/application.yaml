spring:
  application:
    name: project
  datasource:
    url: jdbc:postgresql://localhost:5432/logic
    username: postgres
    password: 1004
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql:
      true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081

file.upload-dir: ./uploads